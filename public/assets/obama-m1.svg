<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img">
  <title>Stylized Barack Obama in charcoal suit, blue tie, short greying hair and microphone</title>
  <defs>
    <linearGradient id="obama-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04101F"/>
      <stop offset="50%" stop-color="#0B2447"/>
      <stop offset="100%" stop-color="#020814"/>
    </linearGradient>
    <linearGradient id="obama-suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F4A5C"/>
      <stop offset="55%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="obama-skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B97A4A"/>
      <stop offset="100%" stop-color="#8A5533"/>
    </linearGradient>
    <linearGradient id="obama-hair" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FFF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="obama-tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Rich Golden/Amber Arena Background -->
  <rect width="600" height="760" fill="url(#obama-bg)"/>
  <g stroke="#3B82F6" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="760"/>
    <line x1="300" y1="0" x2="300" y2="760"/>
    <line x1="450" y1="0" x2="450" y2="760"/>
  </g>
  <circle cx="300" cy="300" r="245" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Navy Suit Shoulders & Torso -->
  <path d="M58 760V646c0-130 88-212 214-224h56c126 12 214 94 214 224v114" fill="url(#obama-suit)" stroke="#06080E" stroke-width="12"/>
  <!-- Crisp White Dress Shirt V-Neck -->
  <path d="M222 446l78 190 78-190z" fill="#F8FAFC" stroke="#06080E" stroke-width="8"/>
  <!-- Neck -->
  <path d="M248 432h104l-10 74-42 32-42-32z" fill="url(#obama-skin)" stroke="#06080E" stroke-width="9"/>
  <!-- White Shirt Collar Wings -->
  <path d="M236 446l64 62-44 38-36-78zM364 446l-64 62 44 38 36-78z" fill="#FFFFFF" stroke="#06080E" stroke-width="8" stroke-linejoin="round"/>
  <!-- Signature Long Red Power Tie -->
  <path d="M282 504h36l10 34-28 24-28-24z" fill="url(#obama-tie)" stroke="#06080E" stroke-width="7"/>
  <path d="M284 554h32l18 206h-68z" fill="url(#obama-tie)" stroke="#06080E" stroke-width="8"/>
  <!-- Suit Lapels & Flag Lapel Pin -->
  <path d="M188 456l96 196-74 108-70-238zM412 456l-96 196 74 108 70-238z" fill="#111827" stroke="#06080E" stroke-width="9"/>
  <!-- Gold & Flag Lapel Pin -->
  <rect x="382" y="546" width="28" height="18" rx="3" fill="#EF4444" stroke="#FACC15" stroke-width="3"/>
  <rect x="382" y="546" width="12" height="10" fill="#1D4ED8"/>

  <!-- Ears -->
  <ellipse cx="160" cy="316" rx="46" ry="64" fill="#8A5533" stroke="#06080E" stroke-width="9"/>
  <ellipse cx="440" cy="316" rx="46" ry="64" fill="#8A5533" stroke="#06080E" stroke-width="9"/>

  <!-- Head & Prominent Jaw/Chin -->
  <path d="M164 244c0-100 60-156 136-156 88 0 140 60 136 164l-10 112c-8 86-64 130-126 130-68 0-120-44-126-130z" fill="url(#obama-skin)" stroke="#06080E" stroke-width="11"/>

  <!-- Short Cropped Greying Hair -->
  <path d="M168 236c-10-96 46-152 132-152s142 56 132 152c-18-46-64-78-132-78s-114 32-132 78z" fill="#27272A" stroke="#06080E" stroke-width="10" stroke-linejoin="round"/>
  <path d="M196 170c30-40 72-58 104-58M310 112c40 2 80 22 104 58" fill="none" stroke="#71717A" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M170 236q2-30 14-46M430 236q-2-30-14-46" fill="none" stroke="#A1A1AA" stroke-width="8" stroke-linecap="round"/>

  <!-- Pale Eye Rings & Narrowed Expressive Eyes -->
  <ellipse cx="244" cy="310" rx="38" ry="22" fill="#C98E5E" opacity="0.55"/>
  <ellipse cx="358" cy="310" rx="38" ry="22" fill="#C98E5E" opacity="0.55"/>
  <!-- Furrowed Golden-Blonde Eyebrows -->
  <path d="M204 286q40-16 80-2M396 286q-40-16-80-2" stroke="#1C1917" stroke-width="14" stroke-linecap="round"/>
  <!-- Eyes -->
  <path d="M214 312q30-16 60 0-30 20-60 0zM328 312q30-16 60 0-30 20-60 0z" fill="#FFFFFF" stroke="#06080E" stroke-width="6"/>
  <circle cx="244" cy="312" r="9" fill="#3B2412"/>
  <circle cx="358" cy="312" r="9" fill="#3B2412"/>

  <!-- Nose & Cheek Lines -->
  <path d="M300 306l-14 62 32 4" fill="none" stroke="#5C3519" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 392q-18 24-10 48M372 392q18 24 10 48" fill="none" stroke="#5C3519" stroke-width="6" stroke-linecap="round"/>
  
  
  <g id="mouth"><ellipse cx="300" cy="422" rx="32" ry="14" fill="#2A0A06" stroke="#5B1A12" stroke-width="8"/><path d="M280 411h40v6h-40z" fill="#FFFFFF"/></g>

  <!-- Arm + hand gripping mic (aimed at mouth) -->
  <path d="M40 760l70-150q22-30 56-26l44 40-52 136z" fill="#1F2937" stroke="#06080E" stroke-width="10" stroke-linejoin="round"/>
  <g transform="translate(236 480) rotate(45)">
    <rect x="-15" y="26" width="30" height="150" rx="14" fill="#475569" stroke="#06080E" stroke-width="8"/>
    <rect x="-17" y="30" width="34" height="14" rx="5" fill="#3B82F6" stroke="#06080E" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="31" ry="38" fill="#1E293B" stroke="#3B82F6" stroke-width="8"/>
    <path d="M-20 -14h40M-24 0h48M-20 14h40M-8 -30v58M8 -30v58" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <rect x="-27" y="78" width="54" height="56" rx="22" fill="#A86B3E" stroke="#06080E" stroke-width="8"/>
    <path d="M-27 92h54M-27 108h54M-27 122h50" stroke="#06080E" stroke-width="4" opacity="0.55"/>
  </g>
</svg>
