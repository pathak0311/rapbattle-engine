<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img">
  <title>Stylized Mark Zuckerberg in grey tee, short curly hair and microphone</title>
  <defs>
    <linearGradient id="zuck-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04112A"/>
      <stop offset="50%" stop-color="#0A2A5E"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="zuck-suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="55%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="zuck-skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FAD9C1"/>
      <stop offset="100%" stop-color="#E7B596"/>
    </linearGradient>
    <linearGradient id="zuck-hair" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FFF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="zuck-tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Rich Golden/Amber Arena Background -->
  <rect width="600" height="760" fill="url(#zuck-bg)"/>
  <g stroke="#3B82F6" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="760"/>
    <line x1="300" y1="0" x2="300" y2="760"/>
    <line x1="450" y1="0" x2="450" y2="760"/>
  </g>
  <circle cx="300" cy="300" r="245" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Navy Suit Shoulders & Torso -->
  <path d="M58 760V646c0-130 88-212 214-224h56c126 12 214 94 214 224v114" fill="url(#zuck-suit)" stroke="#06080E" stroke-width="12"/>
  <!-- Neck -->
  <path d="M248 432h104l-10 74-42 32-42-32z" fill="url(#zuck-skin)" stroke="#06080E" stroke-width="9"/>
  <!-- Grey crew-neck tee -->
  <path d="M232 442q68 56 136 0l18 26q-86 66-172 0z" fill="#4B5563" stroke="#06080E" stroke-width="8"/>

  <!-- Ears -->
  <ellipse cx="156" cy="318" rx="40" ry="58" fill="#E7B596" stroke="#06080E" stroke-width="9"/>
  <ellipse cx="444" cy="318" rx="40" ry="58" fill="#E7B596" stroke="#06080E" stroke-width="9"/>

  <!-- Head & Prominent Jaw/Chin -->
  <path d="M164 244c0-100 60-156 136-156 88 0 140 60 136 164l-10 112c-8 86-64 130-126 130-68 0-120-44-126-130z" fill="url(#zuck-skin)" stroke="#06080E" stroke-width="11"/>

  <!-- Short curly cropped hair -->
  <path d="M166 232c-8-100 48-150 134-150s142 50 134 150c-10-30-30-56-58-66-30 8-118 8-152 0-28 10-48 36-58 66z" fill="#4A3426" stroke="#06080E" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="180" cy="168.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="210" cy="174.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="240" cy="160.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="270" cy="166.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="300" cy="152.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="330" cy="162.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="360" cy="156.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="390" cy="170.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/><circle cx="420" cy="164.0" r="17" fill="#5C4233" stroke="#06080E" stroke-width="5"/>

  <!-- Pale Eye Rings & Narrowed Expressive Eyes -->
  <ellipse cx="244" cy="310" rx="38" ry="22" fill="#FBE3D2" opacity="0.55"/>
  <ellipse cx="358" cy="310" rx="38" ry="22" fill="#FBE3D2" opacity="0.55"/>
  <!-- Furrowed Golden-Blonde Eyebrows -->
  <path d="M206 290q38-10 78-2M394 290q-38-10-78-2" stroke="#4A3426" stroke-width="14" stroke-linecap="round"/>
  <!-- Eyes -->
  <path d="M214 312q30-16 60 0-30 20-60 0zM328 312q30-16 60 0-30 20-60 0z" fill="#FFFFFF" stroke="#06080E" stroke-width="6"/>
  <circle cx="244" cy="312" r="9" fill="#1E3A5F"/>
  <circle cx="358" cy="312" r="9" fill="#1E3A5F"/>

  <!-- Nose & Cheek Lines -->
  <path d="M300 306l-14 62 32 4" fill="none" stroke="#B07A5A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 392q-18 24-10 48M372 392q18 24 10 48" fill="none" stroke="#B07A5A" stroke-width="6" stroke-linecap="round"/>
  <!-- Chin Cleft / Double Chin Curve -->
  <path d="M268 458q32 16 64 0" fill="none" stroke="#B07A5A" stroke-width="6" stroke-linecap="round"/>

  
  <g id="mouth"><ellipse cx="300" cy="422" rx="32" ry="14" fill="#3A1010" stroke="#9F4A4A" stroke-width="8"/><path d="M280 411h40v6h-40z" fill="#FFFFFF"/></g>

  <!-- Arm + hand gripping mic (aimed at mouth) -->
  <path d="M40 760l70-150q22-30 56-26l44 40-52 136z" fill="#6B7280" stroke="#06080E" stroke-width="10" stroke-linejoin="round"/>
  <g transform="translate(236 480) rotate(45)">
    <rect x="-15" y="26" width="30" height="150" rx="14" fill="#475569" stroke="#06080E" stroke-width="8"/>
    <rect x="-17" y="30" width="34" height="14" rx="5" fill="#3B82F6" stroke="#06080E" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="31" ry="38" fill="#1E293B" stroke="#3B82F6" stroke-width="8"/>
    <path d="M-20 -14h40M-24 0h48M-20 14h40M-8 -30v58M8 -30v58" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <rect x="-27" y="78" width="54" height="56" rx="22" fill="#F5D0B5" stroke="#06080E" stroke-width="8"/>
    <path d="M-27 92h54M-27 108h54M-27 122h50" stroke="#06080E" stroke-width="4" opacity="0.55"/>
  </g>
</svg>
